name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'valbot/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valora.p12"
          chmod 600 "$RUNNER_TEMP/valora.p12"
      - name: Assemble signed universal APK
        working-directory: android
        env:
          VALBOT_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/valora.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease assembleReleaseAndroidTest
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p releases
          cp android/app/build/outputs/apk/release/app-release.apk releases/VALORA-1.0.0.apk
          sha256sum releases/VALORA-1.0.0.apk > releases/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            adb install releases/VALORA-1.0.0.apk
            adb install -t android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w io.pearce.valora.test/androidx.test.runner.AndroidJUnitRunner | tee releases/instrumentation.txt
            grep -q 'OK (3 tests)' releases/instrumentation.txt
            adb shell am start -W -n io.pearce.valora/.MainActivity
            sleep 20
            adb shell pidof io.pearce.valora
            adb shell dumpsys activity activities | grep -q 'mResumedActivity.*io.pearce.valora'
            adb shell screencap -p /sdcard/valora-home.png
            adb pull /sdcard/valora-home.png releases/valora-home.png
            adb logcat -d -s AndroidRuntime python.stdout python.stderr > releases/startup-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VALORA-Android
          path: releases/*
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v1.0.0 >/dev/null 2>&1 || gh release create android-v1.0.0 --title 'VALORA Android 1.0.0 · 個人測試版' --notes-file android/RELEASE_NOTES.md
          gh release upload android-v1.0.0 releases/VALORA-1.0.0.apk releases/SHA256SUMS.txt --clobber
