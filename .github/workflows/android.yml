name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'valbot/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/valora.p12"
          chmod 600 "$RUNNER_TEMP/valora.p12"
      - name: Assemble signed universal APK
        working-directory: android
        env:
          VALBOT_BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/valora.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p releases
          cp android/app/build/outputs/apk/release/app-release.apk releases/VALORA-1.0.0.apk
          sha256sum releases/VALORA-1.0.0.apk > releases/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VALORA-Android
          path: releases/*
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v1.0.0 >/dev/null 2>&1 || gh release create android-v1.0.0 --title 'VALORA Android 1.0.0 · 個人測試版' --notes-file android/RELEASE_NOTES.md
          gh release upload android-v1.0.0 releases/VALORA-1.0.0.apk releases/SHA256SUMS.txt --clobber
